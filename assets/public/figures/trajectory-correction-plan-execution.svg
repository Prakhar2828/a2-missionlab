<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="t d"><title id="t">Artemis II trajectory correction plan versus execution</title><desc id="d">Outbound corrections OTC1 and OTC2 were cancelled because the trajectory was on track, OTC3 was executed for 17.5 seconds, and three return corrections were executed with public velocity-change values.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07111a"/><stop offset="1" stop-color="#02070b"/></linearGradient></defs><rect width="1200" height="650" rx="28" fill="url(#bg)"/><g font-family="Inter,Segoe UI,sans-serif"><text x="64" y="64" fill="#f5f8fa" font-size="30" font-weight="700">Trajectory corrections — planned opportunity vs as-flown execution</text><text x="64" y="94" fill="#92a5b3" font-size="16">A cancelled correction can be good news: the predicted trajectory already met the need.</text>
<text x="66" y="145" fill="#7bb7e8" font-size="13" font-weight="700" letter-spacing="2">OUTBOUND · OTC</text><line x1="115" y1="214" x2="1085" y2="214" stroke="#314553" stroke-width="3"/>
<g transform="translate(110 165)"><circle cx="70" cy="49" r="18" fill="#173b2c" stroke="#70c69c" stroke-width="3"/><path d="M61 49l6 6 13-15" fill="none" stroke="#a8e1c1" stroke-width="3"/><text x="70" y="91" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">OTC1</text><text x="70" y="113" fill="#87cba6" font-size="12" text-anchor="middle">CANCELLED</text><text x="70" y="135" fill="#8fa0ac" font-size="11" text-anchor="middle">on correct path</text></g>
<g transform="translate(360 165)"><circle cx="70" cy="49" r="18" fill="#173b2c" stroke="#70c69c" stroke-width="3"/><path d="M61 49l6 6 13-15" fill="none" stroke="#a8e1c1" stroke-width="3"/><text x="70" y="91" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">OTC2</text><text x="70" y="113" fill="#87cba6" font-size="12" text-anchor="middle">CANCELLED</text><text x="70" y="135" fill="#8fa0ac" font-size="11" text-anchor="middle">trajectory on track</text></g>
<g transform="translate(610 165)"><circle cx="70" cy="49" r="18" fill="#16354a" stroke="#7bb7e8" stroke-width="3"/><path d="M70 38v22M59 49h22" stroke="#b7daf3" stroke-width="3"/><text x="70" y="91" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">OTC3</text><text x="70" y="113" fill="#8fc9ef" font-size="12" text-anchor="middle">EXECUTED · 17.5 s</text><text x="70" y="135" fill="#8fa0ac" font-size="11" text-anchor="middle">Δv not public in source</text></g>
<g transform="translate(870 158)"><rect width="220" height="116" rx="14" fill="#101820" stroke="#2e424f"/><text x="18" y="31" fill="#d7b56d" font-size="12" font-weight="700">WHY TWO CANCELLATIONS?</text><text x="18" y="55" fill="#c6d0d7" font-size="12">NASA live reporting:</text><text x="18" y="76" fill="#9eabb4" font-size="11">trajectory already sufficiently</text><text x="18" y="94" fill="#9eabb4" font-size="11">close to the desired path.</text></g>
<text x="66" y="354" fill="#d7b56d" font-size="13" font-weight="700" letter-spacing="2">RETURN · RTC</text><line x1="115" y1="422" x2="1085" y2="422" stroke="#4f4939" stroke-width="3"/>
<g fill="#1a2630" stroke="#d7b56d" stroke-width="3"><circle cx="260" cy="422" r="18"/><circle cx="600" cy="422" r="18"/><circle cx="940" cy="422" r="18"/></g>
<g fill="#fff" font-size="17" font-weight="700" text-anchor="middle"><text x="260" y="471">RTC1</text><text x="600" y="471">RTC2</text><text x="940" y="471">RTC3</text></g>
<g fill="#e0c789" font-size="13" text-anchor="middle"><text x="260" y="494">1.6 ft/s · 15 s</text><text x="600" y="494">5.3 ft/s · 9 s</text><text x="940" y="494">4.2 ft/s · 8 s</text></g>
