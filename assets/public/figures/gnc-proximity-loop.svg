<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="t d">
<title id="t">Educational GNC closed loop for Artemis II proximity operations</title>
<desc id="d">A clear sense, estimate, guide, control, fire, verify loop connected to a simplified Orion proximity-operations objective.</desc>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#6ba7d0"/></marker><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111a"/><stop offset="1" stop-color="#03070b"/></linearGradient></defs>
<rect width="1200" height="560" rx="28" fill="url(#bg)"/>
<g font-family="Inter,Segoe UI,sans-serif">
<text x="60" y="62" fill="#f4f7fa" font-size="30" font-weight="700">Sense → estimate → guide → control → fire → verify.</text>
<text x="60" y="94" fill="#94a6b3" font-size="15">Artemis II context: controlled approach and retreat around the detached ICPS. The exact private control law and state history are not public.</text>
<g transform="translate(62 158)">
  <g fill="#0d1b25" stroke="#355066"><rect x="0" y="0" width="150" height="118" rx="14"/><rect x="180" y="0" width="150" height="118" rx="14"/><rect x="360" y="0" width="150" height="118" rx="14"/><rect x="540" y="0" width="150" height="118" rx="14"/><rect x="720" y="0" width="150" height="118" rx="14"/><rect x="900" y="0" width="150" height="118" rx="14"/></g>
  <g fill="#7bb7e8" font-size="11" font-weight="700" letter-spacing="1.5"><text x="18" y="27">01</text><text x="198" y="27">02</text><text x="378" y="27">03</text><text x="558" y="27">04</text><text x="738" y="27">05</text><text x="918" y="27">06</text></g>
  <g fill="#fff" font-size="18" font-weight="700"><text x="18" y="59">SENSE</text><text x="198" y="59">ESTIMATE</text><text x="378" y="59">GUIDE</text><text x="558" y="59">CONTROL</text><text x="738" y="59">FIRE</text><text x="918" y="59">VERIFY</text></g>
  <g fill="#8ea2b1" font-size="11"><text x="18" y="84">observe motion</text><text x="198" y="84">know the state</text><text x="378" y="84">choose target</text><text x="558" y="84">form correction</text><text x="738" y="84">RCS effectors</text><text x="918" y="84">measure again</text></g>
  <g stroke="#6ba7d0" stroke-width="2.2" marker-end="url(#a)"><path d="M150 59 H170"/><path d="M330 59 H350"/><path d="M510 59 H530"/><path d="M690 59 H710"/><path d="M870 59 H890"/></g>
</g>
<path d="M1112 294 C1112 382 1015 410 900 410 H300 C180 410 137 365 137 294" fill="none" stroke="#3d617a" stroke-width="2" stroke-dasharray="7 8" marker-end="url(#a)"/>
<text x="600" y="438" fill="#8299aa" font-size="12" text-anchor="middle">CLOSED LOOP · every correction is judged by the next measured state</text>
<rect x="60" y="474" width="1080" height="52" rx="12" fill="#251113" stroke="#7d3439"/>
<text x="84" y="505" fill="#e9c3c5" font-size="13"><tspan font-weight="700">Public boundary:</tspan> real proximity-operations context ≠ replay of private state histories, controller gains, or individual thruster firings.</text>
</g></svg>
