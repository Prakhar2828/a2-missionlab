<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="t d"><title id="t">Orion European Service Module propulsion architecture</title><desc id="d">One main engine, eight auxiliary engines, and twenty-four reaction-control thrusters, with a warning that architecture does not prove burn-specific engine assignment.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07111a"/><stop offset="1" stop-color="#03070b"/></linearGradient></defs><rect width="1200" height="650" rx="28" fill="url(#bg)"/><g font-family="Inter,Segoe UI,sans-serif"><text x="64" y="66" fill="#f5f8fa" font-size="30" font-weight="700">European Service Module propulsion — capability, not burn history</text><text x="64" y="96" fill="#93a5b3" font-size="16">Public architecture establishes what Orion can use. It does not identify the engine set for every correction maneuver.</text>
<rect x="70" y="145" width="1060" height="322" rx="22" fill="#0a151e" stroke="#263b4b"/>
<g transform="translate(120 191)"><circle cx="170" cy="118" r="112" fill="#0e1d28" stroke="#3a5a70" stroke-width="2"/><circle cx="170" cy="118" r="64" fill="#0a1218" stroke="#4a6272"/><circle cx="170" cy="118" r="31" fill="#1a2730" stroke="#d7b56d" stroke-width="3"/><text x="170" y="113" fill="#fff" font-size="20" font-weight="700" text-anchor="middle">1</text><text x="170" y="136" fill="#dec48c" font-size="11" text-anchor="middle">MAIN</text>
<g fill="#172732" stroke="#6a8aa0"><circle cx="170" cy="25" r="12"/><circle cx="235" cy="52" r="12"/><circle cx="263" cy="118" r="12"/><circle cx="235" cy="184" r="12"/><circle cx="170" cy="211" r="12"/><circle cx="105" cy="184" r="12"/><circle cx="77" cy="118" r="12"/><circle cx="105" cy="52" r="12"/></g><text x="170" y="257" fill="#8fc1e2" font-size="14" font-weight="700" text-anchor="middle">8 AUXILIARY ENGINES</text><text x="170" y="270" fill="#8396a5" font-size="11" text-anchor="middle">major maneuver capability / redundancy</text></g>
<g transform="translate(550 182)"><text x="0" y="24" fill="#79bbed" font-size="14" font-weight="700" letter-spacing="2">REACTION CONTROL SYSTEM</text><g fill="#122431" stroke="#52728a"><rect x="0" y="56" width="500" height="56" rx="10"/><rect x="0" y="126" width="500" height="56" rx="10"/><rect x="0" y="196" width="500" height="56" rx="10"/></g><text x="24" y="91" fill="#fff" font-size="19" font-weight="700">24 RCS thrusters</text><text x="320" y="91" fill="#91a6b5" font-size="13">attitude + translation control</text><text x="24" y="161" fill="#fff" font-size="16" font-weight="700">Proximity operations</text><text x="320" y="161" fill="#91a6b5" font-size="13">publicly confirmed RCS use</text><text x="24" y="231" fill="#fff" font-size="16" font-weight="700">Exact individual firing history</text><text x="320" y="231" fill="#e4b8ba" font-size="13">not public</text></g>
<rect x="70" y="500" width="1060" height="92" rx="16" fill="#2a1112" stroke="#8b383b"/><text x="98" y="535" fill="#f7d9da" font-size="14" font-weight="700">DO NOT OVER-INFER</text><text x="98" y="562" fill="#d8afb1" font-size="15">Architecture capability ≠ proof that a particular main, auxiliary, or RCS engine performed OTC3, RTC1, RTC2, or RTC3.</text><text x="98" y="583" fill="#9f7d80" font-size="11">Source context: ESA/NASA ESM propulsion architecture + MissionLab evidence boundary.</text></g></svg>
