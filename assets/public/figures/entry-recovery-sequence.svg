<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="t d"><title id="t">Artemis II entry to splashdown public event sequence</title><desc id="d">Minute-resolution NASA event anchors from entry interface through planned blackout, communications reacquisition, drogue and main parachute deployment, and splashdown.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#050a10"/><stop offset=".65" stop-color="#0b2635"/><stop offset="1" stop-color="#163f57"/></linearGradient><linearGradient id="plasma" x2="1"><stop stop-color="#f5d57c"/><stop offset=".5" stop-color="#e96d37"/><stop offset="1" stop-color="#7e1f1e"/></linearGradient></defs><rect width="1200" height="600" rx="28" fill="url(#bg)"/><g font-family="Inter,Segoe UI,sans-serif"><text x="64" y="62" fill="#f5f8fa" font-size="30" font-weight="700">Return to Earth — public event anchors, not a telemetry replay</text><text x="64" y="92" fill="#9db0bd" font-size="15">NASA live-update times are minute-resolution. MissionLab does not invent sub-minute precision.</text>
<path d="M80 180 C320 145 390 360 640 372 S930 470 1110 500" fill="none" stroke="#4d748a" stroke-width="4" stroke-dasharray="5 8"/>
<path d="M90 158 C220 151 300 196 365 264" fill="none" stroke="url(#plasma)" stroke-width="14" opacity=".7"/>
<g transform="translate(75 128)"><circle cx="32" cy="32" r="24" fill="#171f27" stroke="#7bb7e8" stroke-width="3"/><text x="32" y="36" fill="#fff" font-size="12" text-anchor="middle">EI</text><text x="0" y="86" fill="#fff" font-size="15" font-weight="700">23:53 UTC</text><text x="0" y="107" fill="#9fb0bc" font-size="11">400,000 ft</text><text x="0" y="125" fill="#9fb0bc" font-size="11">~Mach 35 reported</text></g>
<g transform="translate(300 228)"><rect width="185" height="98" rx="13" fill="#241315" stroke="#a24e46"/><text x="18" y="29" fill="#f3b59a" font-size="11" font-weight="700">PLANNED BLACKOUT</text><text x="18" y="52" fill="#fff" font-size="15" font-weight="700">~6 minutes</text><text x="18" y="74" fill="#a99594" font-size="11">ionized plasma can block</text><text x="18" y="90" fill="#a99594" font-size="11">radio propagation</text></g>
<g transform="translate(528 323)"><circle cx="31" cy="31" r="22" fill="#17372a" stroke="#70c69c" stroke-width="3"/><text x="31" y="36" fill="#b9e8cd" font-size="15" text-anchor="middle">✓</text><text x="0" y="78" fill="#fff" font-size="14" font-weight="700">~00:00 UTC</text><text x="0" y="99" fill="#9fb0bc" font-size="11">communications reacquired</text></g>
<g transform="translate(710 355)"><path d="M28 34C4 2 56 2 32 34" fill="#e7edf1" stroke="#9bb4c4"/><line x1="30" y1="34" x2="30" y2="62" stroke="#b5c7d2"/><circle cx="30" cy="68" r="9" fill="#29343d"/><text x="0" y="98" fill="#fff" font-size="14" font-weight="700">00:03 UTC</text><text x="0" y="119" fill="#9fb0bc" font-size="11">drogues · 23,400 ft</text></g>
<g transform="translate(875 391)"><g fill="#f1f4f6" stroke="#9eb3c1"><path d="M18 36C-7 -3 44 -3 22 36"/><path d="M49 36C24 -3 75 -3 53 36"/><path d="M80 36C55 -3 106 -3 84 36"/></g><text x="0" y="92" fill="#fff" font-size="14" font-weight="700">00:04 UTC</text><text x="0" y="113" fill="#9fb0bc" font-size="11">3 mains · 5,400 ft</text></g>
<g transform="translate(1010 420)"><path d="M0 55q35-18 70 0q35-18 70 0" fill="none" stroke="#7ec2e9" stroke-width="4"/><circle cx="68" cy="31" r="17" fill="#29343d" stroke="#dce6ec"/><text x="6" y="89" fill="#fff" font-size="14" font-weight="700">00:07 UTC</text><text x="6" y="109" fill="#9fb0bc" font-size="11">Pacific splashdown</text></g>
<rect x="70" y="535" width="1060" height="38" rx="10" fill="#091219" stroke="#2d424f"/><text x="90" y="560" fill="#b9c6cf" font-size="12">Sutton–Graves heat flux in MissionLab is <tspan fill="#d7b56d" font-weight="700">MODELED</tspan>, not measured heat-shield telemetry.</text></g></svg>
