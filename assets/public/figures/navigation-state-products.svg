<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="t d">
<title id="t">Artemis II navigation and state-product evidence architecture</title>
<desc id="d">Dark diagram separating Orion onboard sensing and state estimation, guidance and control, ground orbit determination, and public AROW/OEM trajectory products.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111a"/><stop offset="1" stop-color="#02070b"/></linearGradient>
  <linearGradient id="state" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#123149"/><stop offset="1" stop-color="#0c1e2b"/></linearGradient>
  <marker id="arrowBlue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#78bceb"/></marker>
  <marker id="arrowGold" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#d7b56d"/></marker>
  <marker id="arrowGray" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7b8790"/></marker>
</defs>
<rect width="1200" height="720" rx="28" fill="url(#bg)"/>
<g font-family="Inter,Segoe UI,sans-serif">
  <text x="60" y="58" fill="#f5f8fa" font-size="30" font-weight="700">Navigation is not one state product.</text>
  <text x="60" y="90" fill="#92a4b2" font-size="16">Onboard knowledge, ground solutions, and public trajectory products are related — but they are not interchangeable.</text>

  <rect x="52" y="122" width="1096" height="270" rx="20" fill="#08131c" stroke="#263b4b"/>
  <text x="76" y="156" fill="#79bbed" font-size="14" font-weight="700" letter-spacing="2">ONBOARD ORION · CLOSED LOOP</text>

  <rect x="78" y="194" width="170" height="142" rx="15" fill="#0d1a24" stroke="#365368"/>
  <text x="163" y="222" fill="#8bc7ef" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1.3">SENSE</text>
  <g fill="#dce6ed" font-size="13" text-anchor="middle">
    <text x="163" y="252">Star tracker</text><text x="163" y="277">IMU</text><text x="163" y="302">GPS / other sensors</text>
  </g>
  <text x="163" y="325" fill="#71899a" font-size="10" text-anchor="middle">measurements / references</text>

  <path d="M248 265 H305" stroke="#78bceb" stroke-width="2.2" marker-end="url(#arrowBlue)"/>

  <rect x="322" y="194" width="228" height="142" rx="16" fill="url(#state)" stroke="#5e8eb0"/>
  <text x="436" y="224" fill="#8bc7ef" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1.3">ESTIMATE</text>
  <text x="436" y="260" fill="#fff" font-size="19" font-weight="750" text-anchor="middle">STATE ESTIMATE</text>
  <text x="436" y="287" fill="#a4b5c1" font-size="11.5" text-anchor="middle">position · velocity</text>
  <text x="436" y="306" fill="#a4b5c1" font-size="11.5" text-anchor="middle">attitude · motion knowledge</text>

  <path d="M550 265 H604" stroke="#78bceb" stroke-width="2.2" marker-end="url(#arrowBlue)"/>
  <rect x="621" y="194" width="166" height="142" rx="15" fill="#0d1a24" stroke="#365368"/>
  <text x="704" y="224" fill="#8bc7ef" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1.3">GUIDE</text>
  <text x="704" y="260" fill="#fff" font-size="19" font-weight="700" text-anchor="middle">GUIDANCE</text>
  <text x="704" y="287" fill="#91a3b0" font-size="11.5" text-anchor="middle">desired state</text><text x="704" y="306" fill="#91a3b0" font-size="11.5" text-anchor="middle">target / path</text>

  <path d="M787 265 H836" stroke="#78bceb" stroke-width="2.2" marker-end="url(#arrowBlue)"/>
  <rect x="853" y="194" width="156" height="142" rx="15" fill="#0d1a24" stroke="#365368"/>
  <text x="931" y="224" fill="#8bc7ef" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1.3">CONTROL</text>
  <text x="931" y="260" fill="#fff" font-size="19" font-weight="700" text-anchor="middle">CORRECTION</text>
  <text x="931" y="287" fill="#91a3b0" font-size="11.5" text-anchor="middle">command / allocation</text>

  <path d="M1009 265 H1042" stroke="#78bceb" stroke-width="2.2" marker-end="url(#arrowBlue)"/>
  <rect x="1059" y="194" width="66" height="142" rx="15" fill="#12271f" stroke="#4b8068"/>
  <text x="1092" y="230" fill="#8ed6ae" font-size="10" font-weight="700" text-anchor="middle">FIRE</text>
  <text x="1092" y="260" fill="#fff" font-size="16" font-weight="750" text-anchor="middle">RCS</text>
  <text x="1092" y="286" fill="#91aa9d" font-size="9.5" text-anchor="middle">force</text><text x="1092" y="302" fill="#91aa9d" font-size="9.5" text-anchor="middle">torque</text>

  <path d="M1092 344 C1092 370 1020 374 955 374 H365 C286 374 163 370 163 344" fill="none" stroke="#45677f" stroke-width="1.8" stroke-dasharray="6 7"/>
  <text x="627" y="381" fill="#718b9d" font-size="10.5" text-anchor="middle">VERIFY · the next observation closes the loop</text>

  <rect x="52" y="414" width="532" height="168" rx="18" fill="#0a1117" stroke="#293844"/>
  <text x="76" y="446" fill="#d7b56d" font-size="14" font-weight="700" letter-spacing="2">GROUND NAVIGATION SUPPORT</text>
  <rect x="76" y="474" width="196" height="78" rx="13" fill="#151a1d" stroke="#665b40"/>
  <text x="174" y="504" fill="#e6cb91" font-size="14" font-weight="700" text-anchor="middle">DSN TRACKING</text><text x="174" y="527" fill="#a9a69c" font-size="10.5" text-anchor="middle">external measurements</text>
  <path d="M272 513 H327" stroke="#d7b56d" stroke-width="2" marker-end="url(#arrowGold)"/>
  <rect x="344" y="474" width="212" height="78" rx="13" fill="#151a1d" stroke="#665b40"/>
  <text x="450" y="502" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">GROUND ORBIT</text><text x="450" y="521" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">DETERMINATION</text><text x="450" y="540" fill="#aaa79e" font-size="9.5" text-anchor="middle">separate from onboard state</text>

  <rect x="606" y="414" width="542" height="168" rx="18" fill="#0a1117" stroke="#293844"/>
  <text x="630" y="446" fill="#a7b1ba" font-size="14" font-weight="700" letter-spacing="2">PUBLIC MISSION DATA</text>
  <rect x="630" y="474" width="205" height="78" rx="13" fill="#111820" stroke="#43515d"/>
  <text x="733" y="504" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">AROW / OEM</text><text x="733" y="527" fill="#9cabb6" font-size="10.5" text-anchor="middle">public trajectory product</text>
  <path d="M835 513 H891" stroke="#7b8790" stroke-width="2" stroke-dasharray="5 6" marker-end="url(#arrowGray)"/>
  <rect x="908" y="474" width="216" height="78" rx="13" fill="#13191e" stroke="#596670"/>
  <text x="1016" y="503" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">MISSIONLAB ANALYSIS</text><text x="1016" y="526" fill="#9cabb6" font-size="10.5" text-anchor="middle">geometry · correlations · derived states</text>

  <rect x="52" y="606" width="1096" height="68" rx="14" fill="#281113" stroke="#7e353a"/>
  <circle cx="82" cy="640" r="9" fill="#e45b5e"/>
  <text x="105" y="634" fill="#f7d9da" font-size="14" font-weight="700">EVIDENCE BOUNDARY</text>
  <text x="105" y="654" fill="#d7afb1" font-size="13">Public AROW/OEM vector ≠ Orion onboard navigation-filter state. Ground orbit determination ≠ onboard state estimate.</text>
</g>
</svg>
