name: MissionLab CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python sources
        run: python -m compileall -q scripts

      - name: Validate public text and markup integrity
        run: python scripts/validation/validate_text_integrity.py

      - name: Validate Phase 10 public experience
        run: python scripts/validate_public_experience.py

      - name: Validate Phase O presentation metadata
        run: python scripts/validation/validate_phase_o_presentation.py

      - name: Validate Phase P release-candidate controls
        run: python scripts/validation/validate_phase_p_release_candidate.py

      - name: Validate Phase Q adversarial review and final polish
        run: python scripts/validation/validate_phase_q_adversarial_review.py

      - name: Validate creator identity and executive conversion
        run: python scripts/validation/validate_creator_conversion.py

      - name: Validate Phase 9A publication pack
        run: python scripts/validation/validate_publication_pack.py

      - name: Validate Phase 9B public web
        run: python scripts/validation/validate_publication_web.py

      - name: Validate final MissionLab release
        run: python scripts/validation/validate_release.py

  browser-smoke:
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Chrome runtime dependencies
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: 155.0.8059.39
          install-dependencies: true

      - name: Set up pinned Chrome Headless Shell
        shell: bash
        run: |
          set -euo pipefail
          version="155.0.8059.39"
          archive="$RUNNER_TEMP/chrome-headless-shell-linux64.zip"
          destination="$RUNNER_TEMP/a2-chrome-headless-shell"
          curl --fail --location --silent --show-error \
            "https://storage.googleapis.com/chrome-for-testing-public/${version}/linux64/chrome-headless-shell-linux64.zip" \
            --output "$archive"
          rm -rf "$destination"
          mkdir -p "$destination"
          unzip -q "$archive" -d "$destination"
          binary="$destination/chrome-headless-shell-linux64/chrome-headless-shell"
          test -x "$binary"
          "$binary" --version
          echo "PHASE_P_CHROME=$binary" >> "$GITHUB_ENV"

      - name: Run mandatory Phase P portable browser gate
        run: python scripts/validation/validate_phase_p_regression.py --portable
