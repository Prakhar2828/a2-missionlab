<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>A2 MissionLab Phase R8 continuous EDL regression</title><style>html,body{margin:0;background:#101216;color:#fff;font:13px/1.45 Consolas,monospace}iframe{position:fixed;left:0;top:0;z-index:9999;border:0;background:#000}pre{white-space:pre-wrap;padding:12px}</style></head>
<body data-status="RUNNING" data-engineering-layout-pass="false" data-engineering-play-pass="false" data-continuity-pass="false" data-context-pass="false" data-splash-pass="false" data-responsive-pass="false"><iframe id="app"></iframe><pre id="results">RUNNING</pre>
<script>
(() => {'use strict';
const frame=document.querySelector('#app'),out=document.querySelector('#results');
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const assert=(ok,msg)=>{if(!ok)throw new Error(msg)};
const overflow=(d,s)=>{const e=s?d.querySelector(s):d.documentElement;return e?Math.max(0,e.scrollWidth-e.clientWidth):999};
async function load(w=1440,h=900){
  frame.style.width=`${w}px`;frame.style.height=`${h}px`;
  await new Promise((resolve,reject)=>{
    const timer=setTimeout(()=>reject(new Error('load timeout')),12000);
    frame.onload=()=>{clearTimeout(timer);setTimeout(resolve,300)};
    frame.src='../../mission.html?entry-qa=1&phase-r-qa=1&phase-r7-qa=1&phase-r8-qa=1#entry-lab';
  });
  return {w:frame.contentWindow,d:frame.contentDocument};
}
function rect(el){const r=el.getBoundingClientRect();return {top:r.top,bottom:r.bottom,left:r.left,right:r.right,width:r.width,height:r.height};}
async function main(){
  const page=await load();const d=page.d,w=page.w;
  const engineering=d.querySelector('#entry-lab[data-entry-phase-i]');
  const stage=d.querySelector('.entry-flight-stage');
  const top=d.querySelector('.entry-stage-topline');
  const graph=d.querySelector('#entry-flight-canvas');
  const note=d.querySelector('.entry-stage-note');
  const stagePlay=d.querySelector('#entry-stage-play');
  const stageReset=d.querySelector('#entry-stage-reset');
  const engineeringScrub=d.querySelector('#entry-scrubber');
  const companion=d.querySelector('#entry-visual-companion');
  const visualScrub=d.querySelector('#entry-visual-scrubber');
  assert(engineering&&stage&&top&&graph&&note&&stagePlay&&stageReset&&engineeringScrub&&companion&&visualScrub,'required R8 Entry surfaces missing');

  const tr=rect(top),gr=rect(graph),nr=rect(note),sr=rect(stage);
  let pass=tr.bottom<=gr.top+1&&gr.bottom<=nr.top+1&&sr.height<=680&&sr.height>=420;
  document.body.dataset.engineeringLayoutPass=String(pass);
  assert(pass,`engineering graph chrome overlap/height failed: top=${tr.bottom.toFixed(1)} graph=${gr.top.toFixed(1)}..${gr.bottom.toFixed(1)} note=${nr.top.toFixed(1)} stage=${sr.height.toFixed(1)}`);

  stageReset.click();await wait(60);
  const start=Number(engineeringScrub.value);
  frame.contentWindow.focus();
  await wait(80);

  // Headless --dump-dom can suppress compositor-driven rAF even for an on-screen iframe.
  // For this pacing check only, route the iframe's rAF through its own timer queue so
  // the real product click handler + tick loop execute deterministically. Product files
  // are not modified; all other scene/context checks continue against the live runtime.
  const nativeRAF=w.requestAnimationFrame;
  const nativeCAF=w.cancelAnimationFrame;
  let syntheticId=0;
  const syntheticTimers=new Map();
  w.requestAnimationFrame=cb=>{
    const id=++syntheticId;
    const timer=w.setTimeout(()=>{syntheticTimers.delete(id);cb(w.performance.now());},16);
    syntheticTimers.set(id,timer);
    return id;
  };
  w.cancelAnimationFrame=id=>{const timer=syntheticTimers.get(id);if(timer!==undefined){w.clearTimeout(timer);syntheticTimers.delete(id);}};

  stagePlay.click();await wait(900);
  const afterPlay=Number(engineeringScrub.value);
  const playState=stagePlay.getAttribute('aria-pressed');
  stagePlay.click();
  syntheticTimers.forEach(timer=>w.clearTimeout(timer));syntheticTimers.clear();
  w.requestAnimationFrame=nativeRAF;
  w.cancelAnimationFrame=nativeCAF;

  pass=start===0&&afterPlay>0&&afterPlay<35&&playState==='true'&&engineering.dataset.playbackProfile==='r8-cinematic-paced';
  document.body.dataset.engineeringPlayPass=String(pass);
  assert(pass,`engineering playback pacing failed under deterministic headless frame delivery: start=${start}, after900ms=${afterPlay}, pressed=${playState}, profile=${engineering.dataset.playbackProfile}`);
  stageReset.click();await wait(50);assert(Number(engineeringScrub.value)===0,'engineering reset did not return to analysis start');

  async function at(t){
    visualScrub.value=String(t);
    visualScrub.dispatchEvent(new w.Event('input',{bubbles:true}));
    await wait(80);
    return {...companion.dataset};
  }
  const samples=[];
  for(const t of [54.9,55.1,204.9,205.1,568.9,569.2,628.9,629.2]){
    const s=await at(t);samples.push({t,x:Number(s.poseX),y:Number(s.poseY),mode:s.sceneMode});
  }
  pass=true;
  for(let i=0;i<samples.length;i+=2){
    const a=samples[i],b=samples[i+1];
    const delta=Math.hypot(a.x-b.x,a.y-b.y);
    if(!(Number.isFinite(delta)&&delta<.06))pass=false;
  }
  pass=pass&&companion.dataset.qaContinuous==='true';
  document.body.dataset.continuityPass=String(pass);
  assert(pass,`camera/capsule continuity failed: ${JSON.stringify(samples)}`);

  const descent=await at(300);
  const drogue=await at(590);
  const mainEarly=await at(700);
  const mainLate=await at(790);
  pass=descent.sceneMode==='descent'&&descent.surfaceContext==='cloud-deck'&&descent.oceanVisible==='false'
    &&drogue.sceneMode==='drogue'&&drogue.surfaceContext==='cloud-deck'&&drogue.oceanVisible==='false'
    &&mainEarly.sceneMode==='main'&&mainEarly.oceanVisible==='false'
    &&mainLate.sceneMode==='main'&&mainLate.oceanVisible==='true'&&mainLate.capsuleAfloat==='false';
  document.body.dataset.contextPass=String(pass);
  assert(pass,`phase context separation failed: ${JSON.stringify({descent,drogue,mainEarly,mainLate})}`);

  const splash=await at(817.957676);
  pass=splash.sceneMode==='ocean'&&splash.oceanRecovery==='true'&&splash.earthContext==='none'&&splash.capsuleAfloat==='true'&&splash.parachuteMode==='none'&&splash.cinematicRevision==='r8';
  document.body.dataset.splashPass=String(pass);
  assert(pass,`splashdown scene contract failed: ${JSON.stringify(splash)}`);

  const viewports=[[390,844],[430,932],[768,1024],[844,390],[1280,800],[1440,900]];
  const responsive=[];
  for(const [vw,vh] of viewports){
    frame.style.width=`${vw}px`;frame.style.height=`${vh}px`;await wait(120);
    const pageOverflow=overflow(d),engineeringOverflow=overflow(d,'#entry-lab'),compOverflow=overflow(d,'#entry-visual-companion');
    responsive.push({vw,vh,pageOverflow,engineeringOverflow,compOverflow});
    assert(pageOverflow<=1&&engineeringOverflow<=1&&compOverflow<=1,`overflow at ${vw}x${vh}: page=${pageOverflow}, engineering=${engineeringOverflow}, companion=${compOverflow}`);
  }
  pass=responsive.every(x=>x.pageOverflow<=1&&x.engineeringOverflow<=1&&x.compOverflow<=1);
  document.body.dataset.responsivePass=String(pass);
  assert(pass,'responsive matrix failed');

  document.body.dataset.status='PASS';
  out.textContent=JSON.stringify({layout:{top:tr,graph:gr,note:nr,stage:sr},engineeringPlayback:{start,afterPlay},continuity:samples,contexts:{descent,drogue,mainEarly,mainLate,splash},responsive},null,2);
}
const watchdog=setTimeout(()=>{if(document.body.dataset.status==='RUNNING'){document.body.dataset.status='FAIL';out.textContent=JSON.stringify({fatal:'R8 watchdog timeout'},null,2);}},34000);
main().then(()=>clearTimeout(watchdog)).catch(e=>{clearTimeout(watchdog);document.body.dataset.status='FAIL';out.textContent=JSON.stringify({error:e.message,stack:e.stack},null,2);});
})();
</script></body></html>
