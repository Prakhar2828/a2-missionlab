<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>A2 MissionLab Phase K publication regression</title><style>html,body{margin:0;background:#111;color:#fff;font:13px/1.4 Consolas,monospace}iframe{display:block;border:0;margin:0 0 10px;background:#000}pre{white-space:pre-wrap;padding:12px}</style></head>
<body data-status="RUNNING" data-case-count="0" data-failure-count="0" data-max-overflow="0" data-library-cards="0" data-library-article-count="0" data-report-figures="0" data-report-tables="0"><pre id="results">RUNNING</pre>
<script>
(async()=>{'use strict';
const viewports=[{name:'phone-390x844',width:390,height:844},{name:'landscape-844x390',width:844,height:390},{name:'tablet-768x1024',width:768,height:1024},{name:'desktop-1440x900',width:1440,height:900}];
const results=[];let failures=0,cases=0,maxOverflow=0,maxCards=0,maxArticleCount=0,reportFigures=0,reportTables=0;
const pause=ms=>new Promise(r=>setTimeout(r,ms));
const overflow=doc=>Math.max(0,Math.max(doc.documentElement.scrollWidth,doc.body?doc.body.scrollWidth:0)-doc.documentElement.clientWidth);
const frame=(src,w,h)=>new Promise((resolve,reject)=>{const f=document.createElement('iframe');f.width=String(w);f.height=String(h);f.src=src;f.onload=()=>resolve(f);f.onerror=reject;document.body.appendChild(f);});
function check(ok,label,detail=''){cases++;if(!ok){failures++;results.push(`FAIL ${label}${detail?`: ${detail}`:''}`);}else results.push(`PASS ${label}`);}
for(const vp of viewports){
 const lib=await frame('../../library.html',vp.width,vp.height);await pause(140);const w=lib.contentWindow,d=w.document;
 const cards=[...d.querySelectorAll('.library-result-card')];maxCards=Math.max(maxCards,cards.length);check(cards.length===28,`${vp.name} library initial results`,String(cards.length));
 const filters=[...d.querySelectorAll('.library-filter')];check(filters.length===10,`${vp.name} library category controls`,String(filters.length));
 check((d.querySelector('#library-result-count')?.textContent||'').includes('28 of 28'),`${vp.name} library result count`);
 const entry=filters.find(b=>b.dataset.category==='Entry & Recovery');entry?.click();await pause(50);check(d.querySelectorAll('.library-result-card').length===5,`${vp.name} Entry & Recovery filter`,String(d.querySelectorAll('.library-result-card').length));
 const all=[...d.querySelectorAll('.library-filter')].find(b=>b.dataset.category==='All');all?.click();const input=d.querySelector('#library-search');if(input){input.value='Sutton';input.dispatchEvent(new Event('input',{bubbles:true}));}await pause(50);const suttonCards=[...d.querySelectorAll('.library-result-card')];const suttonIds=suttonCards.map(card=>card.dataset.topic).sort();check(suttonCards.length===2&&suttonIds.includes('convective-heating')&&suttonIds.includes('thermal-protection'),`${vp.name} Sutton search coverage`,`${suttonCards.length} [${suttonIds.join(', ')}]`);
 if(input){input.value='';input.dispatchEvent(new Event('input',{bubbles:true}));}await pause(20);w.location.hash='convective-heating';await pause(120);const articles=d.querySelectorAll('article.deep-dive');maxArticleCount=Math.max(maxArticleCount,articles.length);check(articles.length===1,`${vp.name} single focused deep dive`,String(articles.length));check(d.querySelectorAll('.knowledge-path span').length===4,`${vp.name} knowledge path`);check((d.querySelector('.library-question')?.textContent||'').toLowerCase().includes('sutton'),`${vp.name} curated engineering question`);check(d.querySelectorAll('.related-topics a').length>=1,`${vp.name} related questions`);
 const lo=overflow(d);maxOverflow=Math.max(maxOverflow,lo);check(lo<=1,`${vp.name} library horizontal containment`,`${lo}px`);lib.remove();
 const rep=await frame('../../technical-report.html',vp.width,vp.height);await pause(120);const rd=rep.contentWindow.document;reportFigures=Math.max(reportFigures,rd.querySelectorAll('figure.tech-figure[id]').length);reportTables=Math.max(reportTables,rd.querySelectorAll('table[id] caption').length);check(rd.querySelectorAll('.publication-meta>div').length===4,`${vp.name} report revision metadata`);check(!!rd.querySelector('#executive-summary'),`${vp.name} report executive summary`);check(rd.querySelectorAll('figure.tech-figure[id]').length===13,`${vp.name} report indexed figures`,String(rd.querySelectorAll('figure.tech-figure[id]').length));check(rd.querySelectorAll('table[id] caption').length===3,`${vp.name} report numbered tables`,String(rd.querySelectorAll('table[id] caption').length));check(![...rd.scripts].some(x=>(x.getAttribute('src')||'').endsWith('app.js')),`${vp.name} obsolete report app.js removed`);const ro=overflow(rd);maxOverflow=Math.max(maxOverflow,ro);check(ro<=1,`${vp.name} report horizontal containment`,`${ro}px`);rep.remove();
}
document.body.dataset.status=failures?'FAIL':'PASS';document.body.dataset.caseCount=String(cases);document.body.dataset.failureCount=String(failures);document.body.dataset.maxOverflow=String(maxOverflow);document.body.dataset.libraryCards=String(maxCards);document.body.dataset.libraryArticleCount=String(maxArticleCount);document.body.dataset.reportFigures=String(reportFigures);document.body.dataset.reportTables=String(reportTables);document.querySelector('#results').textContent=results.join('\n');
})().catch(err=>{document.body.dataset.status='FAIL';document.body.dataset.failureCount='1';document.querySelector('#results').textContent=`UNCAUGHT ${err&&err.stack?err.stack:err}`;});
</script></body></html>
